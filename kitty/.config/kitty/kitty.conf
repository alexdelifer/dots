# kitty - Night Owl, matches ghostty/foot/tmux/nvim in ~/dots
font_family      Iosevka Nerd Font
font_size        13.0
background_opacity 0.95
window_padding_width 6
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
scrollback_lines 20000
copy_on_select yes
shell_integration enabled
allow_remote_control yes
listen_on unix:@kitty

# Night Owl
foreground            #d6deeb
background            #011627
selection_foreground  #ffffff
selection_background  #1d3b53
cursor                #80a4c2
cursor_text_color     #011627
url_color             #82aaff
active_border_color   #82aaff
inactive_border_color #1d3b53
active_tab_foreground   #011627
active_tab_background   #82aaff
inactive_tab_foreground #d6deeb
inactive_tab_background #0b2942
color0  #011627
color8  #575656
color1  #ef5350
color9  #ef5350
color2  #22da6e
color10 #22da6e
color3  #addb67
color11 #ffeb95
color4  #82aaff
color12 #82aaff
color5  #c792ea
color13 #c792ea
color6  #21c7a8
color14 #7fdbca
color7  #ffffff
color15 #ffffff

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
