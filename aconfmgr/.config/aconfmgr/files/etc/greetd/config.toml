# greetd + tuigreet, shared by all hosts (aconfmgr 40-hyprland.sh).
# F2 picks another session (Hyprland, Hyprland uwsm, sway, ...); --remember*
# keeps the last user + session in /var/cache/tuigreet.
[terminal]
vt = 1

[default_session]
command = "tuigreet --time --remember --remember-session --asterisks --user-menu --sessions /usr/share/wayland-sessions --cmd start-hyprland"
user = "greeter"
