# Network performance tuning — alex's workstation (10 GbE / 3 Gbit, pulls from EU
# ~120 ms RTT). Delete this file + /etc/modules-load.d/tcp_bbr.conf and run
# `sudo sysctl --system` to revert. Rationale: stock buffers window-capped
# single-stream downloads; raising the receive ceiling took an ISO pull 46 -> 69 MB/s.

# BBR + fq — better recovery on lossy/long paths; helps uploads/seeding; fq paces BBR
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# 64 MiB socket-buffer ceilings (BDP: 3 Gbit x 0.12 s ~= 45 MB). Only the max is
# raised — autotuning keeps idle sockets small; tcp_mem caps the aggregate.
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.ipv4.tcp_rmem = 4096 131072 67108864
net.ipv4.tcp_wmem = 4096 131072 67108864

# 10 GbE receive: absorb bursts without socket-layer drops
net.core.netdev_max_backlog = 16384

# keep long-lived connections fast after an idle gap; probe PMTU
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
