[general]
; intel_pstate default is powersave; switch to performance while a game runs
desiredgov=performance
; renice game processes; backed by "@gamemode - nice -10" in limits.d
renice=10
inhibit_screensaver=1

[gpu]
; 7900 XTX is card2 today, but card index can shift across boots
; (i915 vs amdgpu probe order). Enable only if downclock stutter shows up.
;apply_gpu_optimisations=accept-responsibility
;gpu_device=2
;amd_performance_level=high

[custom]
start=notify-send "GameMode started"
end=notify-send "GameMode ended"
