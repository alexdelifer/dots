# ┌─────────────────────────────────────────────────────────────┐
# │ tmux: Night Owl. Stow package `tmux` → ~/.config/tmux/       │
# │ Plugins live outside the repo in ~/.local/share/tmux/plugins │
# │ Cheatsheet: prefix ?  (prefix = C-a)                         │
# └─────────────────────────────────────────────────────────────┘

# ── Prefix ──────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix                  # C-a C-a sends C-a to the app
bind C-l send-keys 'C-l'              # clear screen (C-l is pane nav)

# ── Terminal / colours ──────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:extkeys:usstyle"
set -as terminal-features ",xterm-256color:RGB,foot:RGB:hyperlinks,alacritty:RGB"
set -s extended-keys on
set -s escape-time 0
set -g focus-events on
set -g allow-passthrough on           # image previews (yazi) + OSC through tmux
set -g set-clipboard on               # OSC 52: copy reaches the system clipboard, even over SSH
set -ga update-environment "TERM TERM_PROGRAM SSH_AUTH_SOCK"

# ── Behaviour ───────────────────────────────────────────────────
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off          # closing a session drops you into another, not out
setw -g aggressive-resize on
set -g display-time 2000
set -g display-panes-time 2000
set -g status-interval 5
setw -g monitor-activity on
set -g visual-activity off
set -g set-titles on
set -g set-titles-string "#S / #W"
setw -g mode-keys vi
set -g status-keys emacs

# ── Keys ────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "  tmux.conf reloaded"

# Splits and windows open in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# (defaults kept: prefix l = last window, prefix ; = last pane)

# Resize (repeatable). Pane *navigation* is C-h/j/k/l (vim-tmux-navigator).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Type into every pane at once (multi-host commands), toggle
bind S setw synchronize-panes \; display "sync #{?synchronize-panes,ON,off}"

# Vi copy mode
bind Escape copy-mode
bind p paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Popups
bind s display-popup -E -w 60% -h 50% -b rounded -S "fg=#5f7e97" \
	"~/.config/tmux/scripts/session-picker"
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -b rounded -S "fg=#5f7e97" lazygit
bind e display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -b rounded -S "fg=#5f7e97" yazi
bind ` display-popup -E -w 80% -h 75% -d "#{pane_current_path}" -b rounded -S "fg=#5f7e97" \
	"tmux new-session -A -s scratch"

# ── Night Owl theme ─────────────────────────────────────────────
#   bg #011627  fg #d6deeb  sel #1d3b53  slate #5f7e97  grey #637777
#   blue #82aaff  cyan #7fdbca  green #addb67  yellow #ecc48d
#   orange #f78c6c  red #ef5350  magenta #c792ea
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=#d6deeb"
set -g status-left-length 40
set -g status-right-length 120

# Session pill: purple, turns green while prefix is held, red in copy mode
set -g status-left "#{?client_prefix,#[fg=#011627 bg=#addb67 bold],#{?pane_in_mode,#[fg=#011627 bg=#ef5350 bold],#[fg=#011627 bg=#c792ea bold]}} Δ #S #[default] "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#5f7e97] #I #W#{?window_zoomed_flag, ⤢,}#{?window_activity_flag, •,} "
setw -g window-status-current-format "#[fg=#82aaff bold] #I #W#{?window_zoomed_flag, ⤢,}#{?pane_synchronized, ⇉,} "

# Right: sync warning, VPN IP (pentest), host, time
set -g status-right "#{?pane_synchronized,#[fg=#011627 bg=#ef5350 bold] SYNC #[default] ,}#[fg=#addb67]#(~/.config/tmux/scripts/vpn-ip)#[fg=#ecc48d]#h #[fg=#637777]%H:%M "

set -g pane-border-lines single
set -g pane-border-indicators arrows
set -g pane-border-style "fg=#1d3b53"
set -g pane-active-border-style "fg=#82aaff"
set -g display-panes-colour "#5f7e97"
set -g display-panes-active-colour "#c792ea"
set -g message-style "bg=#1d3b53,fg=#d6deeb"
set -g message-command-style "bg=#1d3b53,fg=#d6deeb"
setw -g mode-style "bg=#1d3b53,fg=#ffffff"
setw -g clock-mode-colour "#82aaff"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#5f7e97"
set -g menu-border-lines rounded

# ── Plugins (tpm) ───────────────────────────────────────────────
# prefix I install · prefix U update · prefix M-u clean
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'   # C-h/j/k/l across vim + tmux panes
set -g @plugin 'tmux-plugins/tmux-yank'           # y in copy mode → system clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'      # prefix C-s save / C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'      # autosave every 15m, restore on start
set -g @plugin 'tmux-plugins/tmux-logging'        # prefix P log pane, M-P screenshot, M-S-P full history
set -g @plugin 'laktak/extrakto'                  # prefix Tab: fuzzy-pick IPs/paths/hashes from the pane
set -g @plugin 'wfxr/tmux-fzf-url'                # prefix u: open a URL from the pane

set -g @yank_selection_mouse 'clipboard'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @logging-path "$HOME/tmux-logs"
set -g @screen-capture-path "$HOME/tmux-logs"
set -g @save-complete-history-path "$HOME/tmux-logs"
set -g @extrakto_split_direction 'p'              # open in a popup
set -g @extrakto_popup_size '70%,50%'
set -g @extrakto_fzf_layout 'reverse'
set -g @fzf-url-fzf-options '-p 70%,50% --prompt="url Δ " --border-label=" open url "'
set -g @fzf-url-history-limit '2000'

run -b 'mkdir -p ~/tmux-logs'

# Bootstrap tpm + plugins on a fresh machine, then load
if "test ! -d ~/.local/share/tmux/plugins/tpm" \
	"run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm && ~/.local/share/tmux/plugins/tpm/bin/install_plugins'"
run '~/.local/share/tmux/plugins/tpm/tpm'
