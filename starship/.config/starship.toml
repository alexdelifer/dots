"$schema" = 'https://starship.rs/config-schema.json'

# Night Owl. Two-line, Pure-ish layout:
#   ~/dots  zsh/modernize !2 ?1   3s
#  Δ
palette = "night_owl"
add_newline = true
command_timeout = 800

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$dotnet\
$docker_context\
$aws\
$kubernetes\
$cmd_duration\
$fill\
$jobs\
$status\
$time
$character"""

[palettes.night_owl]
bg      = "#011627"
fg      = "#d6deeb"
grey    = "#637777"
slate   = "#5f7e97"
blue    = "#82aaff"
cyan    = "#7fdbca"
teal    = "#21c7a8"
green   = "#addb67"
yellow  = "#ecc48d"
gold    = "#ffeb95"
orange  = "#f78c6c"
red     = "#ef5350"
magenta = "#c792ea"

[character]
success_symbol = "[Δ](bold magenta)"
error_symbol   = "[Δ](bold red)"
vimcmd_symbol  = "[∇](bold green)"

[fill]
symbol = " "

[os]
disabled = true   # off so ~ lines up with Δ; add $os to format to bring it back
style = "slate"
format = "[$symbol]($style)"
[os.symbols]
Macos = " "
Arch  = " "
Linux = " "

[username]
style_user = "yellow"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = true
ssh_symbol = "@"
style = "orange"
format = "[$ssh_symbol$hostname]($style) "

[directory]
style = "bold blue"
read_only = " 󰌾"
read_only_style = "red"
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "magenta"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_commit]
tag_disabled = false
style = "cyan"

[git_state]
style = "bold yellow"

[git_status]
style = "cyan"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "=$count "
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"
untracked = "?$count "
stashed = "≡$count "
modified = "!$count "
staged = "+$count "
renamed = "»$count "
deleted = "✘$count "

[cmd_duration]
min_time = 3_000
style = "yellow"
format = "[ $duration]($style) "
show_notifications = false

[jobs]
symbol = "✦"
style = "teal"

[status]
disabled = false
style = "red"
format = "[✘ $status]($style) "
map_symbol = true

[time]
disabled = false
style = "grey"
format = "[$time]($style)"
time_format = "%H:%M"

[python]
symbol = " "
style = "gold"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "orange"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "cyan"
format = "[$symbol($version )]($style)"

[dotnet]
symbol = " "
style = "magenta"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "

[aws]
symbol = " "
style = "yellow"

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "blue"
format = '[$symbol$context( \($namespace\))]($style) '
