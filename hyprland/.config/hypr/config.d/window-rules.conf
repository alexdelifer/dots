# You can discover a class with 'hyprctl clients'
# Check the syntax on:  https://wiki.hyprland.org/Configuring/Window-Rules/

# 1: random
# 2: browser
# 3: code
# 4: email
# 5: chat
# 6: 
# 7: gaming
# 8: music / audio
# 9: obs
# 0: daemons / agents

# WINDOW RULES
# ============================================================================

# Workspace        RULE                WINDOW

windowrule {
  name = windowrule-1
  workspace = $ws2
  match:class = ^(firefox)$
}

windowrule {
  name = windowrule-2
  workspace = $ws2
  match:class = ^(google-chrome)$
}

windowrule {
  name = windowrule-3
  workspace = $ws3
  match:title = ^(Visual Studio Code)$
}

windowrule {
  name = windowrule-4
  workspace = $ws4
  match:class = ^(thunderbird)$
}

windowrule {
  name = windowrule-5
  workspace = $ws5
  match:class = ^(Signal)$
}

windowrule {
  name = windowrule-6
  workspace = $ws5
  match:class = ^(Element)$
}

windowrule {
  name = windowrule-7
  workspace = $ws5
  match:class = ^(WebCord)$
}

windowrule {
  name = windowrule-8
  workspace = $ws5
  match:class = ^(ferdium)$
}

windowrule {
  name = windowrule-9
  workspace = $ws5
  match:class = ^(discord)$
}

windowrule {
  name = windowrule-10
  workspace = $ws7
  match:class = ^(steam)$
}

windowrule {
  name = windowrule-11
  workspace = $ws7
  match:class = ^(steam_app.*)$
}

windowrule {
  name = windowrule-12
  workspace = $ws7
  tile = on
  match:class = ^(steamwebhelper)$
}

windowrule {
  name = windowrule-13
  workspace = $ws8
  match:class = ^(tidal-hifi)$
}

windowrule {
  name = windowrule-14
  workspace = $ws8
  match:class = ^(com.github.wwmm.easyeffects)$
}

windowrule {
  name = windowrule-15
  workspace = $ws9
  match:class = ^(com.obsproject.Studio)$
}

windowrule {
  name = windowrule-16
  workspace = $ws0
  match:class = ^(ch.proton.bridge-gui)$
}


# xwaylandvideobridge
windowrule {
  name = windowrule-17
  opacity = 0.0 override 0.0 override
  no_anim = on
  no_focus = on
  no_initial_focus = on
  match:class = ^(xwaylandvideobridge)$
}




# Scratchpad       RULE                WINDOW
windowrule {
  name = windowrule-18
  float = on
  match:class = ^(scratchpad)$
}

windowrule {
  name = windowrule-19
  float = on
  match:class = ^(pcmanfm)$
}

windowrule {
  name = windowrule-20
  float = on
  match:class = ^(pcmanfm-qt)$
}

windowrule {
  name = windowrule-21
  float = on
  match:class = ^(pamac-manager)$
}

windowrule {
  name = windowrule-22
  float = on
  match:class = ^(thunar)$
}


# Float             RULE               WINDOW
windowrule {
  name = windowrule-23
  float = on
  match:class = ^(pulsemixer)$
}

windowrule {
  name = windowrule-24
  float = on
  match:class = ^(pavucontrol)$
}

windowrule {
  name = windowrule-25
  float = on
  match:class = ^(calamares)$
}

windowrule {
  name = windowrule-26
  float = on
  match:title = ^(File Transfer*)$
}

windowrule {
  name = windowrule-27
  float = on
  match:title = ^(Firefox — Sharing Indicator)$
}

windowrule {
  name = windowrule-28
  float = on
  match:class = ^(firefox)$
  match:title = ^(library)
}

windowrule {
  name = windowrule-29
  float = on
  match:title = ^(Save File)$
}

windowrule {
  name = windowrule-30
  float = on
  match:class = ^(blueman-manager)$
}

windowrule {
  name = windowrule-31
  float = on
  match:class = ^(thunderbird)$
  match:title = ^(.*Reminder)
}

windowrule {
  name = windowrule-32
  tile = on
  match:class = ^(file-roller)$
  match:title = ^(Archive manager)
}

windowrule {
  name = windowrule-33
  float = on
  match:class = ^(file-roller)$
  match:title = ^(Extract archive)
}


#Special Rules for Steam to get the drop-down and lower right “Add Game” menus to work right.
#windowrulev2   =    stayfocused,       title:^()$,class:^(steam)$
windowrule {
  name = windowrule-34
  min_size = 1 1
  match:title = ^()$
  match:class = ^(steam)$
}


