# Hyprland submaps (modal keybinding layers)
# Triggered from keybindings.conf via: bind = $mod ..., submap, mode_name
#
# Each submap block:
#   submap = <name>   → enter the submap
#   ...bindings...
#   submap = reset    → return to normal mode
#
# All submaps have escape/return as exit keys.
# Active submap is shown in waybar via hyprctl activesubmap.

# ─── mode_resize ──────────────────────────────────────────────────────────────
# Super+R → resize focused window with hjkl

submap = mode_resize

binde = , H, resizeactive, -20 0
binde = , L, resizeactive,  20 0
binde = , K, resizeactive,   0 -20
binde = , J, resizeactive,   0  20

bind = , escape, submap, reset
bind = , return, submap, reset

submap = reset

# ─── mode_move ────────────────────────────────────────────────────────────────
# Super+Shift+A → move focused window to another monitor

submap = mode_move

bind = , H, movewindow, mon:l
bind = , L, movewindow, mon:r
bind = , K, movewindow, mon:u
bind = , J, movewindow, mon:d

bind = , escape, submap, reset
bind = , return, submap, reset

submap = reset

# ─── mode_screenshot ──────────────────────────────────────────────────────────
# Super+Shift+S → screenshot mode
#   a = area, s = full screen, w = active window

submap = mode_screenshot

bind = , a, exec, grimblast copy area
bind = , s, exec, grimblast copy screen
bind = , w, exec, grimblast copy active

bind = , escape, submap, reset
bind = , a,      submap, reset
bind = , s,      submap, reset
bind = , w,      submap, reset

submap = reset

# ─── mode_shutdown ────────────────────────────────────────────────────────────
# Super+Shift+E → power/session mode
#   l = lock, s = suspend, e = logout, r = reboot, p = poweroff

submap = mode_shutdown

bind = , l, exec, $locking
bind = , s, exec, systemctl suspend
bind = , e, exec, hyprctl dispatch exit
bind = , r, exec, systemctl reboot
bind = , p, exec, systemctl poweroff

bind = , escape, submap, reset
bind = , l,      submap, reset
bind = , s,      submap, reset

submap = reset

# ─── mode_displays ────────────────────────────────────────────────────────────
# Super+Shift+D → display/monitor management
#   h/l = move focused workspace to left/right monitor
#   1-5 = focus monitor by index

submap = mode_displays

bind = , H, movecurrentworkspacetomonitor, l
bind = , L, movecurrentworkspacetomonitor, r
bind = , K, movecurrentworkspacetomonitor, u
bind = , J, movecurrentworkspacetomonitor, d

bind = , 1, focusmonitor, 0
bind = , 2, focusmonitor, 1
bind = , 3, focusmonitor, 2
bind = , 4, focusmonitor, 3
bind = , 5, focusmonitor, 4

bind = , escape, submap, reset
bind = , return, submap, reset

submap = reset
