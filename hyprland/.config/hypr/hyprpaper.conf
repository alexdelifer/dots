preload = ~/.config/hypr/skull.jpg

# All five active outputs (post-MST): Acer DP-4, Asus DP-3, Dell DP-5, Dell DP-6, BenQ HDMI-A-2
wallpaper {
    monitor = DP-4
    path = ~/.config/hypr/skull.jpg
    fit_mode = cover
}

wallpaper {
    monitor = DP-5
    path = ~/.config/hypr/skull.jpg
    fit_mode = cover
}

wallpaper {
    monitor = DP-3
    path = ~/.config/hypr/skull.jpg
    fit_mode = cover
}

wallpaper {
    monitor = DP-6
    path = ~/.config/hypr/skull.jpg
    fit_mode = cover
}

wallpaper {
    monitor = HDMI-A-2
    path = ~/.config/hypr/skull.jpg
    fit_mode = cover
}
