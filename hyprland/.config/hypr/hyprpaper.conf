preload = ~/.config/hypr/Hysteresis.png


wallpaper = HDMI-A-2,~/.config/hypr/Hysteresis.png
wallpaper = DP-2,~/.config/hypr/Hysteresis.png
wallpaper = DP-4,~/.config/hypr/Hysteresis.png
wallpaper = DP-3,~/.config/hypr/Hysteresis.png
wallpaper = DP-1,~/.config/hypr/Hysteresis.png

wallpaper {
    monitor = HDMI-A-2
    path = ~/.config/hypr/skull.jpg
    fit_mode = cover
}

wallpaper {
    monitor = DP-2
    path = ~/.config/hypr/skull.jpg
    fit_mode = cover
}

wallpaper {
    monitor = DP-4
    path = ~/.config/hypr/skull.jpg
    fit_mode = cover
}

wallpaper {
    monitor = DP-3
    path = ~/.config/hypr/skull.jpg
    fit_mode = cover
}

wallpaper {
    monitor = DP-1
    path = ~/.config/hypr/skull.jpg
    fit_mode = cover
}