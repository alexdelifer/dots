input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    # true: after workspace switches / window closes, the window already under
    # the cursor gets focus immediately (false required crossing a window edge)
    mouse_refocus = true

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}