# degen (laptop). Internal panel at its native mode with auto scale; anything
# plugged in lands to the right. Hyprland renders on the iGPU (boot GPU) and
# NVIDIA stays asleep until something is offloaded with `prime-run`.
monitor = eDP-1, preferred, 0x0, auto

input {
    touchpad {
        tap-to-click = true
        disable_while_typing = true
    }
}

gesture = 3, horizontal, workspace

# Lock / dpms / suspend on idle (hypridle.conf)
exec-once = hypridle
