# See https://wiki.hyprland.org/Configuring/Monitors/
#
# GPU layout note (2026-06-21):
#   card1 symlink -> PCI 03:00.0 = AMD RX 7900 XTX (amdgpu)  <- primary renderer
#   card0 symlink -> PCI 00:02.0 = Intel UHD 770 (i915)      <- iGPU, currently driving nothing
# AMD listed first = AMD is the primary render device (correct).
#
# *** RDNA3 hard limit: 4 simultaneous display pipes on the AMD card. ***
#
# LIVE STATE (rechecked 2026-07-09): no MST hub, no DP-5/DP-6. Active outputs =
# DP-2, DP-3, DP-4, HDMI-A-3 — all 4 AMD pipes in use. Config verified against
# `hyprctl monitors all` on this date.
#
# TV PLAN: a HARDWARE HDMI splitter hangs off the AMD HDMI port (HDMI-A-3). The
# GPU drives ONE 1080p output; the splitter physically duplicates it to a 1080p
# desktop monitor AND the TV (identical image). Cost to the GPU = 1 pipe, not 2.
env = WLR_DRM_DEVICES,$HOME/.config/hypr/card1:$HOME/.config/hypr/card0

# --- AMD card (4 pipes) ---
# Physical arrangement (confirmed 2026-06-26; bottom row is bottom-aligned at y=2160):
#                                      [BenQ HDMI-A-3 -> splitter -> BenQ + TV]
#     [Acer DP-4 ][Asus DP-3 ][Dell DP-2 ]
# BenQ sits directly above the Dell (same left edge).
# NB: HDMI-A-3 is the BenQ GL2460, already on the AMD card's native HDMI port.
# The splitter inserts BETWEEN this port and the BenQ, mirroring it to the TV.
monitor=DP-4,2560x1440@144,0x720,1       # Acer XG270HU    1440p@144 (bottom-left; "preferred" negotiates 60)
monitor=DP-3,2560x1440@144,2560x720,1    # ROG/Asus PG279Q 1440p@144 (middle)
monitor=DP-2,preferred,5120x1080,1       # Dell P2419H     1080p (bottom-right)

# TV via hardware splitter on the AMD HDMI port. Resolution is hardcoded because a
# splitter presents a merged/quirky EDID that "preferred" can mis-negotiate.
# If the splitter enumerates under a different connector name once plugged in,
# rename HDMI-A-3 here to match `hyprctl monitors all`.
monitor=HDMI-A-3,1920x1080@60,5120x0,1      # BenQ GL2460 1080p + mirrored TV via splitter (above Dell)

# --- Intel iGPU --- nothing connected; left commented so a stray BenQ rule can't fire.
# monitor=HDMI-A-2,preferred,5120x0,1      # BenQ GL2460 (i915) — re-add if you plug it back in

# Truly-dead connectors, kept disabled so stray rules don't fire:
monitor=DP-1,disable

# Workspaces are intentionally NOT pinned to monitors: mod+N summons a workspace
# to the currently focused monitor (focusworkspaceoncurrentmonitor). Pinning rules
# here would snap them back to a "home" monitor on reload/hotplug — don't re-add.

# for xorg games to have correct default display
exec-once = xrandr --output DP-3 --primary
