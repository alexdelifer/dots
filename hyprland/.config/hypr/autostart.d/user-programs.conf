# USER 
# ==============================================================

# ENV
env = MOZ_ENABLE_WAYLAND,1
# AQ_DRM_DEVICES = device list aquamarine (Hyprland's backend) actually reads.
# Use the STABLE by-path symlinks, never raw /dev/dri/cardN (kernel renumbers them).
#   $HOME/.config/hypr/card1 -> PCI 03:00.0 = AMD RX 7900 XTX (all displays live here)
#   $HOME/.config/hypr/card0 -> PCI 00:02.0 = Intel iGPU (no displays plugged in)
# Single-GPU (AMD only) = no cross-GPU copy, no i915 stutter. Append :$HOME/.config/hypr/card0 if you replug the BenQ into the iGPU.
env = AQ_DRM_DEVICES,$HOME/.config/hypr/card1


